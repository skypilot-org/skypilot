# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: prometheus_extra_scrape_configs_test
templates:
  - charts/prometheus/templates/cm.yaml
tests:
  - it: should discover GPU metrics through the named API Service endpoint
    set:
      prometheus.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "job_name: 'skypilot-api-server-gpu-metrics'"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "__meta_kubernetes_endpoint_port_name"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "RELEASE-NAME-api-service;metrics"

  - it: should use fullnameOverride when filtering the API Service endpoint
    set:
      prometheus.enabled: true
      fullnameOverride: custom-name
      prometheus.fullnameOverride: custom-name
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "custom-name-api-service;metrics"

  - it: should render the dedicated Pod scrape job when requested
    set:
      prometheus.enabled: true
      prometheus.useDedicatedScrapeConfig: true
    asserts:
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "job_name: 'skypilot-api-server-metrics'"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "skypilot_co_scrape"

  - it: should NOT render the endpoints-metrics scrape job by default
    set:
      prometheus.enabled: true
    asserts:
      - notMatchRegex:
          path: data["prometheus.yml"]
          pattern: "/endpoints-metrics"

  - it: should render the endpoints-metrics scrape job when scrapeEndpointMetrics is enabled
    set:
      prometheus.enabled: true
      prometheus.scrapeEndpointMetrics: true
    asserts:
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "job_name: 'skypilot-api-server-endpoints-metrics'"
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "/endpoints-metrics"

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: grafana_ingress_annotations_test
templates:
  - templates/grafana-ingress.yaml
tests:
  - it: should render custom annotations when grafana.ingress.annotations is set
    set:
      ingress:
        unified: false
      grafana:
        enabled: true
        ingress:
          enableAuthedIngress: true
          ingressClassName: nginx
          annotations:
            example.com/foo: "bar"
            example.com/baz: "qux"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: metadata.annotations["example.com/foo"]
          value: "bar"
      - equal:
          path: metadata.annotations["example.com/baz"]
          value: "qux"
