# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: api_service_test
templates:
  - templates/api-service.yaml
tests:
  - it: should expose metrics discovery annotations on the Service
    set:
      apiService.metrics.enabled: true
    asserts:
      - equal:
          path: metadata.labels.app
          value: RELEASE-NAME-api
      - equal:
          path: metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: metadata.annotations["prometheus.io/path"]
          value: /metrics
      - equal:
          path: metadata.annotations["prometheus.io/port"]
          value: "9090"
      - contains:
          path: spec.ports
          content:
            port: 9090
            name: metrics
            targetPort: metrics
            protocol: TCP

  - it: should omit standard Service annotations in dedicated scrape mode
    set:
      apiService.metrics.enabled: true
      prometheus.useDedicatedScrapeConfig: true
    asserts:
      - notExists:
          path: metadata.annotations["prometheus.io/scrape"]

  - it: should omit metrics discovery and the metrics port when disabled
    asserts:
      - notExists:
          path: metadata.annotations["prometheus.io/scrape"]
      - notContains:
          path: spec.ports
          content:
            name: metrics

  - it: should not set ipFamilyPolicy by default (single-stack)
    asserts:
      - isKind:
          of: Service
      - notExists:
          path: spec.ipFamilyPolicy

  - it: should not set ipFamilyPolicy for an IPv4 bind host
    set:
      apiService.host: "0.0.0.0"
    asserts:
      - notExists:
          path: spec.ipFamilyPolicy

  - it: should enable dual-stack ipFamilyPolicy for an IPv6 bind host
    set:
      apiService.host: "::"
    asserts:
      - equal:
          path: spec.ipFamilyPolicy
          value: PreferDualStack
