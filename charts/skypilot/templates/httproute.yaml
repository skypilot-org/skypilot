{{- if and .Values.ingress.enabled (eq (.Values.ingress.controllerType | default "ingress") "gateway") -}}
{{- $fullName := include "skypilot.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-httproute
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ $fullName }}-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.ingress.gatewayName | default "skypilot-gateway" }}
  {{- if .Values.ingress.host }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.ingress.path | default "/" }}
      backendRefs:
        - name: {{ $fullName }}-api-service
          port: 80
{{- end }}
