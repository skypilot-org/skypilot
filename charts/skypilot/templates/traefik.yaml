{{- $ingressNginx := index .Values "ingress-nginx" }}
{{- $traefik := .Values.traefik | default dict }}
{{- if $traefik.enabled }}
{{- $nginxProvider := dig "providers" "kubernetesIngressNGINX" dict $traefik }}
{{- /* Helm renders a dependency whose condition path is missing, and the
       Traefik chart's own values set enabled: true. `helm upgrade
       --reuse-values` from a chart version without Traefik therefore renders
       Traefik with only its upstream defaults. */}}
{{- if not $nginxProvider.enabled }}
{{- if $ingressNginx.enabled }}
{{- fail "\nThis release runs the bundled ingress-nginx controller, which is retired upstream. This chart version bundles Traefik instead, but `--reuse-values` keeps the values of the chart version this release was first installed with, which have no Traefik settings. Re-run the upgrade with one of:\n  --reset-then-reuse-values --set ingress-nginx.enabled=false   # switch to Traefik; keeps the external address\n  --set traefik.enabled=false                                  # stay on ingress-nginx" }}
{{- end }}
{{- fail "\nThe chart's Traefik settings are missing, which happens when `--reuse-values` keeps the values of a chart version without Traefik. Re-run the upgrade with `--reset-then-reuse-values`, or add `--set traefik.enabled=false` if you bring your own ingress controller." }}
{{- end }}
{{- if $ingressNginx.enabled }}
{{- fail "\nEnable only one ingress controller: set ingress-nginx.enabled=false to use Traefik, or traefik.enabled=false to keep ingress-nginx." }}
{{- end }}
{{- /* Traefik answers the auth-snippet `return 200` of the service account token
       bypass itself instead of passing the request on, so token requests would
       never reach the API server. */}}
{{- if and .Values.ingress.enabled (index .Values.ingress "oauth2-proxy" "enabled") }}
{{- fail "\nThe bundled Traefik controller does not support ingress.oauth2-proxy: requests with service account tokens would not reach the API server. Move the settings from ingress.oauth2-proxy.* to auth.oauth.*, where the API server checks logins itself: https://docs.skypilot.co/en/latest/reference/auth.html#oauth-migration-guide\nTo keep ingress.oauth2-proxy, use ingress-nginx instead: --set traefik.enabled=false --set ingress-nginx.enabled=true" }}
{{- end }}
{{- if or $ingressNginx.tcp $ingressNginx.udp }}
{{- fail "\ningress-nginx.tcp and ingress-nginx.udp port mappings are not supported with the bundled Traefik controller. To keep them, use ingress-nginx instead: --set traefik.enabled=false --set ingress-nginx.enabled=true" }}
{{- end }}
{{- $svc := $ingressNginx.controller.service | default dict }}
# Traefik's ingress-nginx provider serves Ingresses of this class.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ $nginxProvider.ingressClass | default "nginx" }}
  labels:
    app.kubernetes.io/name: {{ include "skypilot.traefikName" . }}
    app.kubernetes.io/instance: {{ include "skypilot.traefikInstance" . }}
spec:
  controller: {{ $nginxProvider.controllerClass | default "k8s.io/ingress-nginx" }}
{{- if dig "enabled" true $svc }}
{{- if dig "external" "enabled" true $svc }}
---
# The Service in front of Traefik. It keeps the ingress-nginx controller
# Service's name, labels and settings, so a release that switches controllers
# keeps its address.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skypilot.ingressControllerServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skypilot.traefikServiceLabels" (dict "root" . "svc" $svc) | nindent 4 }}
  {{- with $svc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "skypilot.traefikServiceSpec" (dict "root" . "svc" $svc "s" $svc "internal" false) | nindent 2 }}
{{- end }}
{{- $internal := $svc.internal | default dict }}
{{- if and $internal.enabled $internal.annotations }}
---
# The ingress-nginx chart's internal controller Service, in front of Traefik.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skypilot.ingressControllerServiceName" . }}-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skypilot.traefikServiceLabels" (dict "root" . "svc" $svc) | nindent 4 }}
  annotations:
    {{- toYaml $internal.annotations | nindent 4 }}
spec:
  {{- include "skypilot.traefikServiceSpec" (dict "root" . "svc" $svc "s" $internal "internal" true) | nindent 2 }}
{{- end }}
{{- end }}
---
# Traefik runs with namespaced RBAC; IngressClasses are cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-traefik-ingressclasses" .Release.Name .Release.Namespace | trunc 63 | trimSuffix "-" }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-traefik-ingressclasses" .Release.Name .Release.Namespace | trunc 63 | trimSuffix "-" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-traefik-ingressclasses" .Release.Name .Release.Namespace | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ include "skypilot.traefikServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
