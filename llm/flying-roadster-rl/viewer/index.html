<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flying Roadster RL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* HUD styled after skypilot.ai. Palette: sky-100 #ecf2fd, sky-200 #ccdefa, sky-300 #0a55ee (primary blue),
     sky-400 #062152, sky-500 #05092e (navy text), red #fb2c36; warm glows #fdece8 / #e2cde3; black primary chips.
     Type (open substitutes for the proprietary site fonts): KMR Waldenburg (display) -> Inter Tight,
     Inter (UI) -> Inter, Berkeley Mono (labels / numbers) -> JetBrains Mono.
     Panels are light frosted cards (white/86%, thin navy hairline, rounded-md, soft blue shadow) so navy text
     stays readable over the pale sky, the desert and the asphalt alike.
     All HUD sizes are in rem and the root font size tracks the viewport, so
     the overlay reads the same at 960x540, 1920x1080 and 1080x1920. */
  :root {
    --navy: #05092e;
    --navy-2: #062152;
    --blue: #0a55ee;
    --blue-soft: #ccdefa;
    --red: #fb2c36;
    --hud-bg: rgba(255, 255, 255, 0.9);
    --hud-line: rgba(5, 9, 46, 0.10);
    --hud-fg: var(--navy);
    --hud-dim: rgba(6, 33, 82, 0.68);
    --hud-shadow: 0 .15rem .5rem rgba(6, 33, 82, .08), 0 .6rem 1.8rem rgba(6, 33, 82, .12);
    --accent: var(--blue);
    --ok: var(--blue);
    --bad: var(--red);
    --gas: #6f9bf5;
    --f-display: "Inter Tight", "Inter", "Liberation Sans", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    font-size: calc(100vw / 96);
  }
  @media (max-aspect-ratio: 7/5) { :root { font-size: calc(100vw / 70); } }
  @media (max-aspect-ratio: 3/4) { :root { font-size: calc(100vw / 54); } }
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden;
    font-family: "Inter", "Liberation Sans", "Helvetica Neue", Arial, sans-serif; color: var(--hud-fg);
    -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; pointer-events: none; }
  .panel { background: var(--hud-bg); border: 1px solid var(--hud-line); border-radius: .5rem;
    box-shadow: var(--hud-shadow); backdrop-filter: blur(.8rem); -webkit-backdrop-filter: blur(.8rem); }

  /* Navy title on the light sky; a soft white halo keeps it readable over the hills / terrain. */
  #title { top: 2rem; left: 2.2rem; color: var(--navy); max-width: 46vw;
    text-shadow: 0 0 .5rem rgba(255,255,255,.85), 0 0 1.2rem rgba(255,255,255,.6); }
  #title .model { font-family: var(--f-mono); font-size: 1.05rem; font-weight: 600; letter-spacing: .06em;
    color: var(--navy-2); }
  #title .task { font-family: var(--f-display); font-size: 2.9rem; font-weight: 600; letter-spacing: -.018em;
    line-height: 1.05; margin-top: .3rem; }
  /* Chips = SkyPilot buttons: black primary with a white/40 hairline; gale = primary blue. */
  #title .tag { display: inline-block; margin-top: .75rem; padding: .32rem .7rem; border-radius: .35rem;
    font-family: var(--f-mono); font-size: .95rem; font-weight: 600; letter-spacing: .04em;
    background: #0b0b0f; color: #fff; border: 1px solid rgba(255,255,255,.4); text-shadow: none;
    box-shadow: 0 .2rem .8rem rgba(5,9,46,.18); }

  #title #galetag { display: none; margin-left: .45rem; background: var(--blue); color: #fff; }
  #windarrow { width: 1.15rem; height: 1.15rem; margin-left: .45rem; vertical-align: -.2rem; color: var(--blue); transition: none; }
  .gust { color: var(--red) !important; }
  #stats { top: 2rem; right: 2.2rem; padding: .85rem 1.25rem; min-width: 15rem; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 1.6rem; line-height: 1.85; }
  .row + .row { border-top: 1px solid rgba(5,9,46,.06); }
  .row .k { color: var(--hud-dim); letter-spacing: .05em; font-size: .95rem; font-weight: 600;
    font-family: var(--f-mono); }
  .row .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.2rem;
    letter-spacing: -.01em; }

  #gauges { bottom: 2rem; left: 2.2rem; padding: 1rem 1.3rem 1.1rem; display: flex; gap: 1.6rem; align-items: flex-end; }
  .glabel { font-family: var(--f-mono); font-size: .85rem; font-weight: 600; letter-spacing: .06em; color: var(--hud-dim);
    margin-bottom: .5rem; }
  #tank { width: 9.5rem; height: .55rem; border-radius: .3rem; background: rgba(5,9,46,.08); overflow: hidden; }
  #tankfill { height: 100%; width: 100%; border-radius: .3rem; background: linear-gradient(90deg, var(--blue), var(--gas)); }
  #valves { display: grid; grid-template-columns: repeat(2, 2.1rem); gap: .4rem .5rem; margin-top: .9rem; }
  .valve { width: 2.1rem; height: 3rem; border-radius: .35rem; background: #eef1f7; position: relative; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(5,9,46,.08); }
  .valve > div { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, var(--blue), #a9c5fa);
    box-shadow: 0 0 .8rem rgba(10,85,238,.45); }
  .valve span { position: absolute; top: .22rem; width: 100%; text-align: center; font-family: var(--f-mono); font-size: .72rem;
    font-weight: 700; letter-spacing: 0; z-index: 2; color: var(--navy);
    text-shadow: 0 0 .25rem rgba(255,255,255,.9), 0 0 .5rem rgba(255,255,255,.7); }
  #rotbox { position: relative; min-width: 8.6rem; padding-bottom: .1rem; }
  #rot { font-family: var(--f-display); font-size: 3.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1;
    letter-spacing: -.035em; transform-origin: left bottom; }
  #rotlabel { font-family: var(--f-mono); font-size: .85rem; font-weight: 600; letter-spacing: .06em; color: var(--hud-dim);
    margin-top: .35rem; }
  #rotpop { position: absolute; left: 0; bottom: 4.6rem; font-family: var(--f-display); font-size: 1.7rem; font-weight: 700;
    letter-spacing: -.01em; color: #fff; background: var(--blue); padding: .15rem .6rem; border-radius: .4rem; opacity: 0;
    white-space: nowrap; transform-origin: left bottom; border: 1px solid rgba(255,255,255,.4);
    box-shadow: 0 .3rem 1.4rem rgba(10,85,238,.45); }

  #banner { top: 19%; left: 50%; transform: translate(-50%, 0); opacity: 0; text-align: center;
    padding: .95rem 2.4rem 1.05rem; white-space: nowrap; overflow: hidden; }
  #banner::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .2rem; background: var(--c, var(--ok)); }
  #banner .bk { font-family: var(--f-mono); font-size: .9rem; font-weight: 700; letter-spacing: .14em;
    color: var(--c, var(--ok)); }
  #banner .bm { font-family: var(--f-display); font-size: 2.4rem; font-weight: 600; letter-spacing: -.02em; margin-top: .1rem; }
  #banner .bs { font-family: var(--f-mono); font-size: .95rem; font-weight: 500; color: var(--hud-dim); margin-top: .25rem; }
  #banner.ok { --c: var(--ok); }
  #banner.bad { --c: var(--bad); }

  /* Brand line as a small frosted chip with the SkyPilot logo mark (the icon from skypilot.ai's header logo). */
  /* Pilot mode: the LLM's command stream (only for clips with a decision_log). */
  #pilot { top: 19.2rem; right: 2.2rem; padding: .85rem 1.2rem .9rem; min-width: 19rem; display: none; }
  #pilot .pk { font-family: var(--f-mono); font-size: .85rem; font-weight: 600; letter-spacing: .06em; color: var(--hud-dim);
    }
  #pilot .pc { font-family: var(--f-mono); font-size: 1.45rem; font-weight: 600; color: var(--navy); margin-top: .3rem; white-space: nowrap; }
  #pilot .pc.wait { color: var(--bad); }
  #pilot .pl { font-family: var(--f-mono); font-size: .9rem; font-weight: 500; color: var(--hud-dim); margin-top: .3rem; }
  #pilot .ph { font-family: var(--f-mono); font-size: .85rem; color: var(--hud-dim); opacity: .75; margin-top: .45rem;
    border-top: 1px solid rgba(5,9,46,.06); padding-top: .4rem; white-space: nowrap; }
  #brand { bottom: 2rem; right: 2.2rem; font-size: .95rem; font-weight: 500; color: var(--navy-2); text-align: right;
    line-height: 1.35; padding: .4rem .75rem .4rem 2.1rem; border-radius: .5rem; background: rgba(255,255,255,.82);
    border: 1px solid var(--hud-line); box-shadow: var(--hud-shadow); }
  #brand::before, #card .cb::before { content: ""; position: absolute; left: .7rem; top: 50%; width: 1.05rem; height: 1.05rem;
    transform: translateY(-50%);

3 4.99265 21.0349 4.94558C21.027 4.79348 20.9054 4.67193 20.7533 4.66406C20.7063 4.66163 20.6413 4.67911 20.5113 4.71408L4.83527 8.9304Z' fill='%23075BF9'%3E%3C/path%3E%3C/svg%3E") center / contain no-repeat; }
  #brand b, #card .cb b { color: var(--navy); font-weight: 700; }

  /* Intro / outro: light, airy card with soft periwinkle + peach glows (skypilot.ai hero). */
  #card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; opacity: 0; pointer-events: none; padding: 0 8vw; color: var(--navy);
    backdrop-filter: blur(.2rem); -webkit-backdrop-filter: blur(.2rem);
    background:
      radial-gradient(ellipse 42% 30% at 20% 26%, rgba(170,198,246,.55) 0%, rgba(170,198,246,0) 100%),
      radial-gradient(ellipse 42% 32% at 82% 76%, rgba(253,226,218,.7) 0%, rgba(253,226,218,0) 100%),
      radial-gradient(ellipse 28% 22% at 76% 20%, rgba(211,155,243,.25) 0%, rgba(211,155,243,0) 100%),
      radial-gradient(ellipse 60% 45% at center, rgba(255,255,255,.8) 0%, rgba(255,255,255,.55) 60%, rgba(251,250,255,.4) 100%); }
  #card .ck { font-family: var(--f-mono); font-size: 1.1rem; font-weight: 600; letter-spacing: .12em;
    color: var(--blue); }
  #card .ct { font-family: var(--f-display); font-size: 4.6rem; font-weight: 500; letter-spacing: -.028em; line-height: 1.04;
    margin-top: .9rem; }
  #card .cs { font-size: 1.5rem; font-weight: 400; color: var(--navy-2); margin-top: 1.2rem; max-width: 60rem; line-height: 1.4; }
  #card .cb { position: absolute; bottom: 2.4rem; font-size: 1rem; font-weight: 500; color: var(--navy-2);
    padding: .4rem .8rem .4rem 2.2rem; border-radius: .5rem; background: rgba(255,255,255,.7); border: 1px solid var(--hud-line); }
  body.card .hud { display: none !important; }

  #controls { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;
    background: var(--hud-bg); border: 1px solid var(--hud-line); padding: 8px 10px; border-radius: 8px; box-shadow: var(--hud-shadow); }
  #controls select, #controls button { background: #0b0b0f; color: #fff; border: 1px solid rgba(255,255,255,.4);
    border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  #controls select { background: #eceaeb; color: var(--navy); border-color: transparent; }
  body.record #controls { display: none; }

  /* Portrait / near-square panels (social layouts). */
  @media (max-aspect-ratio: 7/5) {
    #title { max-width: 60vw; }
    #title .task { font-size: 2.4rem; }
    #stats { min-width: 0; padding: .6rem .9rem; }
    .row { gap: 1rem; line-height: 1.7; }
    #banner { top: 26%; }
    #brand { font-size: .8rem; }
  }
  @media (max-aspect-ratio: 3/4) {
    #title { top: 3.2rem; }
    #stats { top: 3.2rem; }
    #banner { top: 22%; }
    #gauges { bottom: 3.6rem; }
    #brand { bottom: 3.6rem; }
    #card .ct { font-size: 4rem; }
  }
</style>

<body>
<canvas id="c"></canvas>
<div class="hud" id="title"><div class="model" id="model">—</div><div class="task" id="task">—</div><div class="tag" id="tag">cold-gas thrusters</div><div class="tag" id="galetag">gale</div></div>
<div class="hud panel" id="stats">
  <div class="row"><span class="k">time</span><span class="v" id="s-t">0.00 s</span></div>
  <div class="row"><span class="k">altitude</span><span class="v" id="s-z">0.0 m</span></div>
  <div class="row"><span class="k">speed</span><span class="v" id="s-v">0 km/h</span></div>
  <div class="row" id="windrow"><span class="k">wind</span><span class="v"><span id="s-w">0 m/s</span><svg id="windarrow" viewBox="0 0 24 24"><path d="M3 12h14M12 6l7 6-7 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
  <div class="row" id="gustrow"><span class="k gust">gusting</span><span class="v gust" id="s-g">+0 m/s</span></div>
  <div class="row"><span class="k">reward</span><span class="v" id="s-r">—</span></div>
</div>
<div class="hud panel" id="gauges">
  <div>
    <div class="glabel">air tank</div>
    <div id="tank"><div id="tankfill"></div></div>
    <div id="valves">
      <div class="valve"><span>FL</span><div id="v0"></div></div>
      <div class="valve"><span>FR</span><div id="v1"></div></div>
      <div class="valve"><span>RL</span><div id="v2"></div></div>
      <div class="valve"><span>RR</span><div id="v3"></div></div>
    </div>
  </div>
  <div id="rotbox"><div id="rotpop">360°!</div><div id="rot">0°</div><div id="rotlabel">rotation</div></div>
</div>
<div class="hud panel" id="banner"></div>
<div class="hud panel" id="pilot"><div class="pk">pilot command</div><div class="pc" id="p-cmd">—</div>
  <div class="pl" id="p-lat"></div><div class="ph" id="p-hist"></div></div>
<div class="hud" id="brand">Simulated on <b>SkyPilot</b></div>
<div id="card"><div class="ck" id="card-k"></div><div class="ct" id="card-t"></div><div class="cs" id="card-s"></div>
  <div class="cb" id="card-b">Simulated on <b>SkyPilot</b></div></div>
<div id="controls">
  <select id="epsel"></select>
  <button id="play">Replay</button>
  <button id="cam">Camera: auto</button>
</div>

<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Coordinate mapping: sim is z-up (x fwd, y left); three.js is y-up.
// sim (x, y, z) -> three (x, z, -y). Proper rotation, so quaternion vector
// parts map the same way. The car's right-hand side faces three +z.
// ---------------------------------------------------------------------------
const toV = (x, y, z) => new THREE.Vector3(x, z, -y);
const toQ = (w, x, y, z) => new THREE.Quaternion(x, z, -y, w);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, f) => a + (b - a) * f;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const $ = (id) => document.getElementById(id);

const params = new URLSearchParams(location.search);
const RECORD = params.has('record');
if (RECORD) document.body.classList.add('record');

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(RECORD ? 1 : Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

// Loft hand-authored key sections along x into a flat-shaded faceted mesh.
// keys: ascending x; profile(S) -> half section [[z, y, tag], ...] from the
// bottom centre round the +z (right) side to the top centre. post(x, y, z, tag)
// may move a vertex and returns [y, z, tag]. matOf(tags) -> material index.
function facetLoft(keys, profile, post, matOf, step = .025) {
  const xs = [];
  for (let k = 0; k < keys.length - 1; k++) {
    const a = keys[k].x, b = keys[k + 1].x, n = Math.max(1, Math.ceil((b - a) / step));
    for (let i = 0; i < n; i++) xs.push(a + (b - a) * i / n);

  const at = (x) => {
    let k = 0; while (k < keys.length - 2 && x > keys[k + 1].x) k++;
    const A = keys[k], B = keys[k + 1], f = clamp((x - A.x) / (B.x - A.x), 0, 1), S = {};
    for (const key in A) S[key] = lerp(A[key], B[key], f);

    const half = profile(at(x));
    const full = half.concat(half.slice(1, -1).reverse().map(([z, y, tg]) => [-z, y, tg]));
    return full.map(([z, y, tg]) => { const r = post ? post(x, y, z, tg) : [y, z, tg]; return { p: [x, r[0], r[1]], tg: r[2] }; });
  });

  const tri = (a, b, c) => tris.push([matOf([a.tg, b.tg, c.tg]), a.p, b.p, c.p]);
  for (let i = 0; i < rings.length - 1; i++) {
    const R0 = rings[i], R1 = rings[i + 1], n = R0.length;
    for (let j = 0; j < n; j++) {

    const c = [0, 0, 0]; R.forEach(v => { c[0] += v.p[0] / R.length; c[1] += v.p[1] / R.length; c[2] += v.p[2] / R.length; });

    for (let j = 0; j < R.length; j++) { const a = R[j], b = R[(j + 1) % R.length]; front ? tri(C, b, a) : tri(C, a, b); }

// Visual-only aftermath after the sim ends: a small rigid-box tumble for

  const rotEl = $('rot'), pop = $('rotpop');
  if (sp) {
    const p = (t - sp.t) / .95;
    const sc = 1 + .55 * Math.exp(-p * 9) * Math.cos(p * 14);
    pop.textContent = `${sp.n * 360}°!`;
    pop.style.opacity = (p < .08 ? p / .08 : 1 - sstep(.55, 1, p)).toFixed(3);
    pop.style.transform = `translateY(${(-p * 1.4).toFixed(3)}rem) scale(${sc.toFixed(3)})`;
    const k = Math.exp(-p * 6);
    rotEl.style.transform = `scale(${(1 + .14 * k).toFixed(3)})`;
    rotEl.style.color = `rgb(${Math.round(5 + 5 * k)},${Math.round(9 + 76 * k)},${Math.round(46 + 192 * k)})`;  // navy -> SkyPilot blue flash
  } else { pop.style.opacity = 0; rotEl.style.transform = 'none'; rotEl.style.color = ''; }
  rotEl.textContent = `${Math.round(deg)}°`;  // the 360°! badge itself is gated on the true value above
  for (let i = 0; i < 4; i++) $('v' + i).style.height = (t >= P.tEnd ? 0 : clamp(seriesAt(P, P.thr[i], t), 0, 1) * 100).toFixed(0) + '%';
  $('rotlabel').textContent = EP.task.kind === 'backflip' ? 'pitch' : EP.task.kind === 'ramp_flip' ? 'rotation' : 'roll';
  $('s-t').textContent = `${tc.toFixed(2)} s`;
  $('s-z').textContent = `${Math.max(0, row[3] - P.rest).toFixed(1)} m`;
  $('s-v').textContent = `${(vel.length() * 3.6).toFixed(0)} km/h`;
  if (P.wind) {
    // Wind readout: speed of the air at the car + arrow showing where it blows on screen.
    const tw = Math.min(t, P.tEnd), w = windAtCar(P, tw), ws = w.length();
    $('s-w').textContent = `${ws.toFixed(0)} m/s`;
    const p0 = car.position.clone().project(camera), p1 = car.position.clone().add(w.clone().normalize()).project(camera);
    const ang = Math.atan2(-(p1.y - p0.y) * innerHeight, (p1.x - p0.x) * innerWidth) * 180 / Math.PI;
    const c = w.clone().normalize().dot(camera.getWorldDirection(new THREE.Vector3()));
    const mode = c > .8 ? 'away' : c < -.8 ? 'toward' : 'arrow';
    $('windarrow').innerHTML = mode === 'arrow' ? '<path d="M3 12h14M12 6l7 6-7 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
      : mode === 'away' ? '<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'
      : '<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="2.8" fill="currentColor"/>';
    $('windarrow').style.transform = mode === 'arrow' ? `rotate(${ang.toFixed(1)}deg)` : 'none';
    $('windarrow').setAttribute('aria-label', mode === 'arrow' ? 'wind direction on screen' : mode === 'away' ? 'blowing into the screen' : 'blowing out of the screen');
    const g = seriesAt(P, P.gust, tw);
    const gusting = g > Math.max(1.2, .1 * ws);
    $('gustrow').style.display = gusting ? '' : 'none';
    $('s-g').textContent = `+${g.toFixed(0)} m/s`;
  }
  $('tankfill').style.width = (row[12] * 100).toFixed(1) + '%';
  const ended = t >= P.tEnd;
  $('s-r').textContent = ended ? EP.reward.toFixed(2) : '—';
  const b = $('banner');
  if (ended) {
    if (!b.innerHTML) {
      const ok = EP.landed && !EP.crashed && EP.reward >= .85;
      b.className = 'hud panel ' + (ok ? 'ok' : 'bad');
      const why = EP.crashed ? EP.crashed.replace(/_/g, ' ') : EP.controller_error ? 'controller error' :
        EP.landed ? 'incomplete stunt' : 'never landed';
      const nSpin = Math.floor(Math.abs(P.rot[P.rot.length - 1]) / (2 * Math.PI) + .02);
      const what = EP.task.kind === 'ramp_flip' ? ' · half-loop + inverted launch' : EP.task.kind.includes('flip') && nSpin ? ` · ${nSpin * 360}° ${EP.task.kind === 'backflip' ? 'backflip' : 'kickflip'}` : '';
      b.innerHTML = ok ? `<div class="bk">landed</div><div class="bm">Stuck the landing</div><div class="bs">reward ${EP.reward.toFixed(2)}${what}</div>`
        : `<div class="bk">${EP.crashed ? 'crash' : 'fail'}</div><div class="bm">${EP.crashed ? 'Crashed' : 'Failed'}</div><div class="bs">${why} · reward ${EP.reward.toFixed(2)}</div>`;
    }
    const k = sstep(P.tEnd + .15, P.tEnd + .6, t);
    b.style.opacity = k.toFixed(3);
    b.style.transform = `translate(-50%, ${((1 - k) * -.8).toFixed(3)}rem)`;
  } else if (b.innerHTML) { b.innerHTML = ''; b.style.opacity = 0; }
}

// --- title cards (intro / outro), rendered over a slow orbit of the car -------
function renderCard(t, card = {}) {
  if (!EP) return;
  const P = EP._P;
  document.body.classList.add('card');
  const dur = card.duration || 2.5, atEnd = card.kind === 'outro';
  const S = sampleP(P, atEnd ? P.tEnd + P.hold : P.t0);
  car.position.copy(S.p); car.quaternion.copy(S.q);
  for (let i = 0; i < car.plumes.length; i++) { car.plumes[i].visible = false; car.nozzleRings[i].material.opacity = 0; }
  for (let i = 0; i < 4; i++) { car.blurs[i].material.opacity = 0; car.spokes[i].visible = true; }
  car.setWing(atEnd && EP.crashed ? 1 : 0);
  car.setFans(0, 0);
  pAlpha.fill(0); pScale.fill(0); pGeo.attributes.alpha.needsUpdate = pGeo.attributes.psize.needsUpdate = true;
  for (const tr of trails) { tr.al.fill(0); tr.g.attributes.alpha.needsUpdate = true; }
  const asp = camera.aspect, fov = asp < .9 ? 54 : asp < 1.4 ? 46 : 40;
  if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); }
  const a = (atEnd ? 120 : 150) * Math.PI / 180 - t / dur * .45, d = asp < 1 ? 11 : 8.5;
  const f = S.p.clone(); f.y = Math.max(f.y, .4);
  camera.position.set(f.x - Math.cos(a) * d, 1.3 + .3 * t / dur, f.z + Math.sin(a) * d);
  camera.lookAt(f.x, f.y + (asp < 1 ? 2.2 : 1.5), f.z);
  window._cones.update(camera.position);
  WIND.h = 1; updateWindsocks(t, windAtCar(P, atEnd ? P.tEnd : P.t0)); streakAl.fill(0); streakGeo.attributes.alpha.needsUpdate = true;
  sun.position.copy(f).addScaledVector(SUN_DIR, 60).setY(f.y + 38); sun.target.position.copy(f);
  fill.position.copy(camera.position).add(new THREE.Vector3(0, 6, 0)); fill.target.position.copy(f);
  $('card-k').textContent = card.kicker || '';
  $('card-t').innerHTML = (card.title || '').replace(/\n/g, '<br>');
  $('card-s').textContent = card.subtitle || '';
  $('card-b').style.display = /skypilot/i.test((card.title || '') + (card.subtitle || '')) ? 'none' : '';
  const k = Math.min(sstep(0, .35, t), 1 - sstep(dur - .3, dur, t));
  const el = $('card'); el.style.opacity = k.toFixed(3);
  el.querySelector('.ct').style.transform = `translateY(${((1 - sstep(0, .5, t)) * 1.2).toFixed(3)}rem)`;
  renderer.render(scene, camera);
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  pMat.uniforms.scale.value = h * pr / (2 * Math.tan(camera.fov * Math.PI / 360));
  pMat.uniforms.maxPx.value = h * pr * .16;
}
window.addEventListener('resize', resize); resize();
// Keep the particle projection scale in sync with fov changes.
const _render = renderer.render.bind(renderer);
renderer.render = (s, c) => { const pr = renderer.getPixelRatio(); pMat.uniforms.scale.value = innerHeight * pr / (2 * Math.tan(c.fov * Math.PI / 360)); _render(s, c); };

// --- public API for the headless recorder ----------------------------------
window.loadEpisode = (ep, opts) => setupEpisode(prepare(ep), opts);
window.renderAt = renderAt;
window.renderCard = renderCard;
window.viewerReady = true;
window.__viewer = { THREE, scene, camera, car, renderer };  // debugging / stills tooling

// --- interactive mode ---------------------------------------------------------
let playing = null;
function play() {
  const dur = duration(); const t0 = performance.now();
  lastT = null; cancelAnimationFrame(playing);
  const loop = () => { const t = (performance.now() - t0) / 1000; renderAt(Math.min(t, dur));
    playing = requestAnimationFrame(loop); if (t > dur + 1.2) { cancelAnimationFrame(playing); setTimeout(play, 300); } };
  loop();
}
const sel = $('epsel');
async function boot() {
  let eps = window.EPISODES;
  if (!eps && params.get('episodes')) eps = await (await fetch(params.get('episodes'))).json();
  if (!eps || RECORD) return;
  eps.forEach((e, i) => { const o = document.createElement('option'); o.value = i; o.textContent = e.label || `episode ${i}`; sel.appendChild(o); });
  const pick = () => { const ep = eps[+sel.value]; window.loadEpisode(ep, { model: ep.label, camera: camMode }); play(); };
  sel.onchange = pick;
  $('play').onclick = play;
  const modes = ['auto', 'chase', 'rear', 'side', 'top']; let mi = 0;
  $('cam').onclick = () => { mi = (mi + 1) % modes.length; camMode = modes[mi]; $('cam').textContent = 'Camera: ' + camMode; };
  pick();
}
boot();
</script>
