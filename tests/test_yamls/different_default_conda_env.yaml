# conda is no longer installed by default; opt in so this test can exercise the
# custom-default-conda-env behavior (and the install_conda=true opt-in path).
config:
  provision:
    install_conda: true

resources:
  cpus: 2+


setup: |
  conda create -n testenv python=3.6 -y

  echo "conda activate testenv" >> ~/.bashrc

run: |
  python --version 2>&1 | grep "Python 3.6" || exit 1
