# JobGroup contradiction: inter_connection: true requires infra with
# in-group networking support, but a job pins infra without it. Submission
# must fail fast.
---
name: {{name}}
execution: parallel
inter_connection: true
---
name: pinned-azure
resources:
  cpus: 2
  infra: azure
run: echo hi
---
name: flexible
resources:
  cpus: 2
run: echo hi
