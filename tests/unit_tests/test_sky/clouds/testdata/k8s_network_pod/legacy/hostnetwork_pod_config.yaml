apiVersion: v1

kind: Pod

metadata:
  labels:
    parent: skypilot
    skypilot-cluster: c
    skypilot-user: null
    skypilot-binpack: gpu
  annotations:
    skypilot-user: ''

spec:
  serviceAccountName: skypilot-service-account
  automountServiceAccountToken: true
  restartPolicy: Never
  dnsPolicy: ClusterFirstWithHostNet
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: skypilot.co/accelerator
            operator: In
            values:
            - h100
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: skypilot-binpack
              operator: In
              values:
              - gpu
          topologyKey: kubernetes.io/hostname
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            skypilot-cluster: c
        topologyKey: kubernetes.io/hostname
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
  - name: fusermount-shared-dir
    hostPath:
      path: /var/run/fusermount
      type: DirectoryOrCreate
  containers:
  - name: ray-node
    imagePullPolicy: Always
    image: test-image:latest
    env:
    - name: SKYPILOT_POD_NODE_TYPE
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['ray-node-type']
    - name: SKYPILOT_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: SKYPILOT_POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: SKYPILOT_POD_CPU_CORE_LIMIT
      valueFrom:
        resourceFieldRef:
          containerName: ray-node
          resource: requests.cpu
    - name: SKYPILOT_POD_MEMORY_BYTES_LIMIT
      valueFrom:
        resourceFieldRef:
          containerName: ray-node
          resource: requests.memory
    - name: RAY_memory_monitor_refresh_ms
      value: '0'
    - name: SKYPILOT_IN_CLUSTER_CONTEXT_NAME
      value: test-context
    - name: SKYPILOT_HOST_NETWORK
      value: '1'
    - name: SKYPILOT_RAY_PORTS_CONFIGMAP_NAME
      value: c-ray-ports
    - name: SKYPILOT_RAY_PORTS_CONFIGMAP_NAMESPACE
      value: default
    - name: FUSERMOUNT_SHARED_DIR
      value: /var/run/fusermount
    volumeMounts:
    - mountPath: /dev/shm
      name: dshm
    - name: fusermount-shared-dir
      mountPath: /var/run/fusermount
    resources:
      requests:
        cpu: 8.0
        memory: 64.0G
        nvidia.com/gpu: 8
      limits:
        nvidia.com/gpu: 8
