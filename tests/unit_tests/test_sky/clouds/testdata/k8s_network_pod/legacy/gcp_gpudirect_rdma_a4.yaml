apiVersion: v1

kind: Pod

metadata:
  labels:
    parent: skypilot
    skypilot-cluster: c
    skypilot-user: null
    skypilot-binpack: gpu
  annotations:
    skypilot-user: ''
    skypilot-workspace: null
    skypilot-priority-class: null
    networking.gke.io/default-interface: eth0
    networking.gke.io/interfaces: "[\n  {\"interfaceName\":\"eth0\",\"network\":\"\
      default\"},\n  {\"interfaceName\":\"eth1\",\"network\":\"gvnic-1\"},\n  {\"\
      interfaceName\":\"eth2\",\"network\":\"rdma-0\"},\n  {\"interfaceName\":\"eth3\"\
      ,\"network\":\"rdma-1\"},\n  {\"interfaceName\":\"eth4\",\"network\":\"rdma-2\"\
      },\n  {\"interfaceName\":\"eth5\",\"network\":\"rdma-3\"},\n  {\"interfaceName\"\
      :\"eth6\",\"network\":\"rdma-4\"},\n  {\"interfaceName\":\"eth7\",\"network\"\
      :\"rdma-5\"},\n  {\"interfaceName\":\"eth8\",\"network\":\"rdma-6\"},\n  {\"\
      interfaceName\":\"eth9\",\"network\":\"rdma-7\"}\n]\n"

spec:
  serviceAccountName: skypilot-service-account
  automountServiceAccountToken: true
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: skypilot.co/accelerator
            operator: In
            values:
            - h100
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: skypilot-binpack
              operator: In
              values:
              - gpu
          topologyKey: kubernetes.io/hostname
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
  - name: fusermount-shared-dir
    hostPath:
      path: /var/run/fusermount
      type: DirectoryOrCreate
  - name: library-dir-host
    hostPath:
      path: /home/kubernetes/bin/nvidia
  - name: gib
    hostPath:
      path: /home/kubernetes/bin/gib
  containers:
  - name: ray-node
    imagePullPolicy: Always
    image: test-image:latest
    env:
    - name: SKYPILOT_POD_NODE_TYPE
      valueFrom:
        fieldRef:
          fieldPath: metadata.labels['ray-node-type']
    - name: SKYPILOT_POD_CPU_CORE_LIMIT
      valueFrom:
        resourceFieldRef:
          containerName: ray-node
          resource: requests.cpu
    - name: SKYPILOT_POD_MEMORY_BYTES_LIMIT
      valueFrom:
        resourceFieldRef:
          containerName: ray-node
          resource: requests.memory
    - name: RAY_memory_monitor_refresh_ms
      value: '0'
    - name: SKYPILOT_IN_CLUSTER_CONTEXT_NAME
      value: test-context
    - name: LD_LIBRARY_PATH
      value: /usr/local/nvidia/lib64
    - name: NCCL_NET
      value: gIB
    - name: NCCL_CROSS_NIC
      value: '0'
    - name: NCCL_NET_GDR_LEVEL
      value: PIX
    - name: NCCL_P2P_NET_CHUNKSIZE
      value: '131072'
    - name: NCCL_NVLS_CHUNKSIZE
      value: '524288'
    - name: NCCL_IB_ADAPTIVE_ROUTING
      value: '1'
    - name: NCCL_IB_QPS_PER_CONNECTION
      value: '4'
    - name: NCCL_IB_TC
      value: '52'
    - name: NCCL_IB_FIFO_TC
      value: '84'
    - name: NCCL_TUNER_CONFIG_PATH
      value: /usr/local/gib/configs/tuner_config_a4.txtpb
    - name: FUSERMOUNT_SHARED_DIR
      value: /var/run/fusermount
    ports:
    - containerPort: 22
    - containerPort: null
    - containerPort: 10001
    - containerPort: null
    - containerPort: 46590
    volumeMounts:
    - mountPath: /dev/shm
      name: dshm
    - name: library-dir-host
      mountPath: /usr/local/nvidia
    - name: gib
      mountPath: /usr/local/gib
    - name: fusermount-shared-dir
      mountPath: /var/run/fusermount
    resources:
      requests:
        cpu: 8.0
        memory: 64.0G
        nvidia.com/gpu: 8
      limits:
        nvidia.com/gpu: 8
    securityContext:
      capabilities:
        add:
        - IPC_LOCK
