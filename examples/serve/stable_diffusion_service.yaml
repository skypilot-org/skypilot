# SkyServe YAML to run the InvokeAI Stable Diffusion web UI with multiple replicas.
#
# Usage:
#   sky serve up -n sd examples/serve/stable_diffusion_service.yaml
# Then open the endpoint printed by `sky serve status sd` in your browser.

service:
  readiness_probe: /
  replicas: 2

envs:
  HUGGING_FACE_HUB_TOKEN: ""  # optional, for gated Hugging Face models

resources:
  ports: 9090
  accelerators: L4:1

setup: |
  set -e
  docker pull ghcr.io/invoke-ai/invokeai

run: |
  set -e
  mkdir -p ~/invokeai
  docker rm -f invokeai 2>/dev/null || true
  docker run -d --name invokeai --restart on-failure \
    --gpus all \
    -p 9090:9090 \
    -v ~/invokeai:/invokeai \
    -e HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-} \
    ghcr.io/invoke-ai/invokeai
  docker logs -f invokeai
