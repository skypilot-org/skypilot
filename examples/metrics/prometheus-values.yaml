server:
  persistentVolume:
    enabled: true
    size: 50Gi
  retention: "1000d"
  retentionSize: "43GB"
  # scrape_timeout must be longer than the SkyPilot API server's
  # PER_CONTEXT_TIMEOUT_SECONDS (30s in sky/metrics/utils.py), otherwise
  # this Prometheus will time out scraping /gpu-metrics on large clusters
  # and mark the api-server target as down.
  global:
    scrape_timeout: 45s
kube-state-metrics:
  enabled: true
  metricLabelsAllowlist:
    - pods=[skypilot-cluster,skypilot-cluster-name]
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
alertmanager:
  enabled: false
