# A minimal example.
#
# Runs a task that simply prints a message. Kept dependency-free (no conda/pip)
# so it works on any image, including bare base images.
#
# Usage:
#   sky launch -c min minimal.yaml
#   sky down min

name: minimal

resources:
  infra: aws

setup: |
  echo "running setup"

run: |
  echo "hello, SkyPilot!"
