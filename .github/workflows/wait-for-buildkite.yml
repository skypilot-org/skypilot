name: Wait for Buildkite Build

on:
  workflow_call:
    inputs:
      organization:
        required: true
        type: string
        description: "Buildkite organization name"
      pipeline:
        required: true
        type: string
        description: "Buildkite pipeline name"
      build_number:
        required: true
        type: string
        description: "Buildkite build number to wait for"
      timeout_minutes:
        required: false
        type: number
        default: 120
        description: "Timeout in minutes (default: 2 hours)"
      fail_on_buildkite_failure:
        required: false
        type: boolean
        default: true
        description: "Whether to fail the job if the Buildkite build fails (default: true)"
    secrets:
      BUILDKITE_TOKEN:
        required: true
        description: "Buildkite API token; needs write access so a cancelled run can cancel its build"
    outputs:
      build_status:
        description: "Final status of the build (success, failure, timeout)"
        value: ${{ jobs.wait.outputs.build_status }}

jobs:
  wait:
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.wait_buildkite.outputs.build_status }}
    steps:
      - name: Wait for Buildkite build completion
        id: wait_buildkite
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
          FAIL_ON_BUILDKITE_FAILURE: ${{ inputs.fail_on_buildkite_failure }}
        run: |
          organization="${{ inputs.organization }}"
          pipeline="${{ inputs.pipeline }}"
          build_number="${{ inputs.build_number }}"
          max_attempts=$((2 * ${{ inputs.timeout_minutes }}))  # Check every 30 seconds
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -H "Authorization: Bearer $BUILDKITE_TOKEN" \
              "https://api.buildkite.com/v2/organizations/$organization/pipelines/$pipeline/builds/$build_number")

            # Check if response contains only an error message
            if [ $(echo "$response" | jq 'has("message") and length == 1') == "true" ]; then
              error_message=$(echo "$response" | jq -r '.message')
              echo "Error from Buildkite API: $error_message"
              echo "build_status=failure" >> $GITHUB_OUTPUT
              exit 1
            fi

            status=$(echo "$response" | jq -r '.state')

            case $status in
              "passed")
                echo "Buildkite build succeeded"
                echo "build_status=success" >> $GITHUB_OUTPUT
                exit 0
                ;;
              "failed"|"canceled"|"blocked")
                echo "Buildkite build failed with status: $status"
                echo "build_status=failure" >> $GITHUB_OUTPUT
                if [ "$FAIL_ON_BUILDKITE_FAILURE" = "true" ]; then
                  exit 1
                else
                  echo "Not failing workflow despite Buildkite failure: $status"
                  exit 0
                fi
                ;;
              *)
                echo "Buildkite build status: $status - waiting..."
                sleep 30
                attempt=$((attempt+1))
                ;;
            esac
          done

          echo "Timeout waiting for Buildkite build to complete (${{ inputs.timeout_minutes }} minute limit reached)"
          echo "build_status=timeout" >> $GITHUB_OUTPUT
          if [ "$FAIL_ON_BUILDKITE_FAILURE" = "true" ]; then
            exit 1
          else
            echo "Not failing workflow despite Buildkite timeout"
            exit 0
          fi

      # A cancelled GitHub run does not cancel the Buildkite build it is
      # waiting on; the build keeps holding agents on the shared queue until
      # it finishes on its own. Steps guarded by cancelled() still run after
      # a cancellation, so forward it here.
      - name: Cancel the Buildkite build if this run was cancelled
        if: cancelled()
        env:
          BUILDKITE_TOKEN: ${{ secrets.BUILDKITE_TOKEN }}
          ORGANIZATION: ${{ inputs.organization }}
          PIPELINE: ${{ inputs.pipeline }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          # GitHub runs step shells as `bash -e`, which `set -uo pipefail` does
          # not clear. Leaving it on would kill this step at the first `jq`
          # against a non-JSON error body -- the 503-with-an-HTML-page case --
          # before any of the retry or state-verification logic below runs.
          set +e
          set -uo pipefail

          api="https://api.buildkite.com/v2/organizations/$ORGANIZATION/pipelines/$PIPELINE/builds/$BUILD_NUMBER"
          echo "Run cancelled; cancelling Buildkite build $BUILD_NUMBER of $PIPELINE"

          # Sets $code and $body. curl exits 0 on an HTTP error, so read the
          # status explicitly; a network-level failure reports 000.
          call() {
            local method=$1 url=$2 out
            out=$(mktemp)
            code=$(curl -s --connect-timeout 5 --max-time 10 \
              -o "$out" -w '%{http_code}' -X "$method" \
              -H "Authorization: Bearer $BUILDKITE_TOKEN" "$url") || code=000
            body=$(cat "$out")
            rm -f "$out"
          }

          # States in which the build has stopped holding agents. Losing the
          # race to a build that finishes on its own is a harmless outcome.
          settled() {
            case "$1" in
              canceling|canceled|passed|failed|skipped|not_run) return 0 ;;
              *) return 1 ;;
            esac
          }

          # GitHub force-kills the runner shortly after a cancellation, so the
          # whole step has to stay well under a minute.
          deadline=$((SECONDS + 45))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            call PUT "$api/cancel"
            state=$(printf '%s' "$body" | jq -r '.state // empty' 2>/dev/null)

            case "$code" in
              2*)
                if settled "$state"; then
                  echo "Buildkite replied: $state"
                  exit 0
                fi
                ;;
              401|403)
                echo "::error::Buildkite rejected the token (HTTP $code); build $BUILD_NUMBER is still running"
                exit 1
                ;;
            esac

            message=$(printf '%s' "$body" | jq -r '.message // empty' 2>/dev/null)
            echo "Cancel attempt $attempt did not take (HTTP $code)${message:+: $message}"

            # The build may have finished between the wait loop and this step,
            # in which case the API refuses the cancel. Ask what state it is in
            # rather than pattern-matching the refusal message.
            call GET "$api"
            state=$(printf '%s' "$body" | jq -r '.state // empty' 2>/dev/null)
            if settled "$state"; then
              echo "Build $BUILD_NUMBER is already $state; nothing left to cancel"
              exit 0
            fi
            echo "Build $BUILD_NUMBER is currently: ${state:-unknown (HTTP $code)}"

            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            sleep 5
          done

          echo "::error::Could not cancel Buildkite build $BUILD_NUMBER; it may still be holding agents: $api"
          exit 1
